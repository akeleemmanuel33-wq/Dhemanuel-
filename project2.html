<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEMANUEL - Projects</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #e8e8e8;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: rgba(0, 0, 0, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 60px rgba(0, 0, 0, 0.15);
            --accent-gradient: linear-gradient(135deg, #000000, #444444);
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: rgba(255, 255, 255, 0.1);
            --glass-bg: rgba(30, 30, 30, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            --shadow-hover: 0 20px 60px rgba(0, 0, 0, 0.95);
            --accent-gradient: linear-gradient(135deg, #ffffff, #bbbbbb);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 80px;
        }

        /* ── Header ── */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 500;
            padding: 14px 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
            transform: translateX(-3px);
        }

        .theme-toggle {
            width: 46px;
            height: 24px;
            background: var(--bg-secondary);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .theme-toggle::before {
            content: '☀️';
            position: absolute;
            top: 50%;
            left: 2px;
            width: 18px;
            height: 18px;
            background: var(--text-primary);
            border-radius: 50%;
            transform: translateY(-50%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        [data-theme="dark"] .theme-toggle::before {
            content: '🌙';
            left: calc(100% - 20px);
        }

        /* ── Page Hero ── */
        .page-hero {
            padding: 140px 0 60px;
            text-align: center;
        }

        .page-hero-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .page-hero h1 {
            font-size: clamp(40px, 6vw, 72px);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-hero p {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 560px;
            margin: 0 auto 40px;
        }

        /* Filter pills */
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 60px;
        }

        .filter-pill {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--glass-bg);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .filter-pill:hover,
        .filter-pill.active {
            background: var(--text-primary);
            color: var(--bg-primary);
            border-color: var(--text-primary);
        }

        /* ── Projects Grid ── */
        .projects-section { padding: 0 0 120px; }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .project-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(30px);
            animation: cardIn 0.5s ease forwards;
        }

        .project-card.hidden { display: none; }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .project-status {
            position: absolute;
            top: 16px; right: 16px;
            background: #10b981;
            color: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2;
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }

        .project-image-container {
            width: 100%;
            height: 190px;
            overflow: hidden;
            background: var(--bg-secondary);
        }

        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .project-card:hover .project-image { transform: scale(1.08); }

        .project-content {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .project-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .project-description {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 16px;
            flex: 1;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .tech-badge {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .tech-badge:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .project-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .project-link:hover { gap: 10px; color: #2563eb; }

        /* Explore Button */
        .explore-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .explore-btn:hover {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99,102,241,0.3);
        }

        .explore-btn svg {
            transition: transform 0.3s ease;
        }

        .explore-btn:hover svg { transform: translateX(3px); }

        /* ── Popup Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            width: 100%;
            max-width: 860px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.88) translateY(30px);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .modal-overlay.open .modal {
            transform: scale(1) translateY(0);
        }

        /* Modal Header Image */
        .modal-cover {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 28px 28px 0 0;
            display: block;
        }

        .modal-cover-overlay {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 280px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.6));
            border-radius: 28px 28px 0 0;
        }

        .modal-close {
            position: absolute;
            top: 20px; right: 20px;
            width: 42px; height: 42px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .modal-close:hover {
            background: rgba(239,68,68,0.8);
            transform: rotate(90deg);
        }

        .modal-status-tag {
            position: absolute;
            top: 20px; left: 20px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: white;
            z-index: 10;
        }

        .modal-body {
            padding: 36px;
        }

        /* Modal top meta */
        .modal-meta-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
        }

        .modal-title {
            font-size: 30px;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-primary);
        }

        .modal-live-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: #3b82f6;
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .modal-live-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59,130,246,0.4);
        }

        /* Info chips row */
        .modal-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
        }

        .modal-chip {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
        }

        .modal-chip svg { flex-shrink: 0; }

        /* Section heading inside modal */
        .modal-section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        .modal-section-title svg { color: #6366f1; }

        /* Story */
        .modal-story {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 32px;
            padding: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        /* Build timeline */
        .modal-timeline {
            margin-bottom: 32px;
        }

        .timeline-item {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            position: relative;
        }

        .timeline-item:not(:last-child)::before {
            content: '';
            position: absolute;
            left: 19px;
            top: 40px;
            width: 2px;
            height: calc(100% - 8px);
            background: var(--border-color);
        }

        .timeline-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #6366f1;
            transition: all 0.3s ease;
        }

        .timeline-item:hover .timeline-dot {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        .timeline-content {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 18px;
            flex: 1;
            backdrop-filter: blur(10px);
        }

        .timeline-phase {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .timeline-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .timeline-duration {
            font-size: 11px;
            font-weight: 600;
            color: #6366f1;
            margin-top: 6px;
        }

        /* Rating Chart */
        .modal-ratings {
            margin-bottom: 32px;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .rating-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            width: 130px;
            flex-shrink: 0;
        }

        .rating-bar-track {
            flex: 1;
            height: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            overflow: hidden;
        }

        .rating-bar-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #6366f1, #ec4899);
            width: 0%;
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .rating-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            width: 32px;
            text-align: right;
            flex-shrink: 0;
        }

        /* Screenshots */
        .modal-screenshots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .screenshot-item {
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/10;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .screenshot-item:hover {
            transform: scale(1.03);
            box-shadow: var(--shadow-hover);
        }

        .screenshot-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Fields/Tags */
        .modal-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
        }

        .field-tag {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1.5px solid;
            transition: all 0.3s ease;
            cursor: default;
        }

        .field-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }

        .field-tag.purple  { color: #7c3aed; border-color: #7c3aed; background: rgba(124,58,237,0.08); }
        .field-tag.blue    { color: #2563eb; border-color: #2563eb; background: rgba(37,99,235,0.08); }
        .field-tag.green   { color: #059669; border-color: #059669; background: rgba(5,150,105,0.08); }
        .field-tag.orange  { color: #d97706; border-color: #d97706; background: rgba(217,119,6,0.08); }
        .field-tag.pink    { color: #db2777; border-color: #db2777; background: rgba(219,39,119,0.08); }
        .field-tag.teal    { color: #0d9488; border-color: #0d9488; background: rgba(13,148,136,0.08); }
        .field-tag.red     { color: #dc2626; border-color: #dc2626; background: rgba(220,38,38,0.08); }

        /* Divider */
        .modal-divider {
            height: 1px;
            background: var(--border-color);
            margin: 24px 0;
        }

        /* ── Page Loader ── */
        #page-loader {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #page-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .loader-spinner {
            width: 70px;
            height: 70px;
            margin: 0 auto 24px;
            position: relative;
        }

        .loader-ring {
            position: absolute;
            inset: 0;
            border: 3px solid transparent;
            border-radius: 50%;
            animation: spin-loader 1.2s cubic-bezier(0.5,0,0.5,1) infinite;
        }

        .loader-ring:nth-child(1) { border-top-color: #6366f1; animation-delay: -0.45s; }
        .loader-ring:nth-child(2) { border-top-color: #ec4899; animation-delay: -0.3s; }
        .loader-ring:nth-child(3) { border-top-color: #10b981; animation-delay: -0.15s; }

        @keyframes spin-loader { to { transform: rotate(360deg); } }

        .loader-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ── Responsive ── */
        @media (max-width: 1024px) {
            .container { padding: 0 40px; }
            .projects-grid { grid-template-columns: repeat(2, 1fr); gap: 22px; }
        }

        @media (max-width: 640px) {
            .container { padding: 0 20px; }
            .projects-grid { grid-template-columns: 1fr; }
            .modal-body { padding: 24px 20px; }
            .modal-title { font-size: 22px; }
            .modal-meta-row { flex-direction: column; }
            .modal-cover { height: 200px; }
            .modal-cover-overlay { height: 200px; }
            .modal-screenshots { grid-template-columns: repeat(2, 1fr); }
            .rating-label { width: 100px; font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- Loader -->
<div id="page-loader">
    <div class="loader-spinner">
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
        <div class="loader-ring"></div>
    </div>
    <div class="loader-text">Loading...</div>
</div>

<!-- Header -->
<header>
    <div class="container">
        <nav>
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Logo" class="logo-icon">
                HEMANUEL
            </a>
            <div class="nav-right">
                <a href="index.html" class="back-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                    Back Home
                </a>
                <div class="theme-toggle" id="themeToggle"></div>
            </div>
        </nav>
    </div>
</header>

<!-- Page Hero -->
<section class="page-hero">
    <div class="container">
        <div class="page-hero-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            All Projects
        </div>
        <h1>Explore the Henueic World</h1>
        <p>From SaaS platforms to more logical projects that would leave you amazed.</p>

        <div class="filter-bar">
            <button class="filter-pill active" data-filter="all">All</button>

// ── Render Cards ──
function renderCards(data) {
    const grid = document.getElementById('projectsGrid');
    grid.innerHTML = '';
    data.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.style.animationDelay = `${i * 0.07}s`;
        card.innerHTML = `
            <span class="project-status" style="background:${p.statusColor}">${p.status}</span>
            <div class="project-image-container">
                <img src="${p.image}" alt="${p.title}" class="project-image" loading="lazy">
            </div>
            <div class="project-content">
                <h3 class="project-title">${p.title}</h3>
                <p class="project-description">${p.description}</p>
                <div class="project-tech">
                    ${p.tech.map(t => `<span class="tech-badge">${t}</span>`).join('')}
                </div>
                <div class="project-footer">
                    <a href="${p.liveUrl}" class="project-link" target="_blank">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
                        View Live
                    </a>
                    <button class="explore-btn" data-id="${p.id}">
                        Explore
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>
                    </button>
                </div>
            </div>`;
        grid.appendChild(card);
    });

    // Explore button listeners
    document.querySelectorAll('.explore-btn').forEach(btn => {
        btn.addEventListener('click', () => openModal(parseInt(btn.dataset.id)));
    });
}

// ── Filter ──
document.querySelectorAll('.filter-pill').forEach(pill => {
    pill.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        const f = pill.dataset.filter;
        renderCards(f === 'all' ? projects : projects.filter(p => p.category === f));
    });
});

// ── Modal ──
const overlay = document.getElementById('modalOverlay');
const modal   = document.getElementById('modal');

function openModal(id) {
    const p = projects.find(x => x.id === id);
    if (!p) return;

    // Cover
    document.getElementById('modalCover').src = p.image;

    // Status
    const tag = document.getElementById('modalStatusTag');
    tag.textContent = p.status;
    tag.style.background = p.statusColor;

    // Title + live
    document.getElementById('modalTitle').textContent = p.title;
    document.getElementById('modalLiveBtn').href = p.liveUrl;

    // Chips
    document.getElementById('modalChips').innerHTML = `
        <div class="modal-chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
            Founded ${p.date}
        </div>
        <div class="modal-chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Build time: ${p.buildTime}
        </div>
        <div class="modal-chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" x2="7.01" y1="7" y2="7"/></svg>
            ${p.category}
        </div>`;

    // Story
    document.getElementById('modalStory').textContent = p.story;

    // Timeline
    document.getElementById('modalTimeline').innerHTML = p.timeline.map(t => `
        <div class="timeline-item">
            <div class="timeline-dot">${t.icon}</div>
            <div class="timeline-content">
                <div class="timeline-phase">${t.phase}</div>
                <div class="timeline-desc">${t.desc}</div>
                <div class="timeline-duration">${t.duration}</div>
            </div>
        </div>`).join('');

    // Ratings
    document.getElementById('modalRatings').innerHTML = p.ratings.map(r => `
        <div class="rating-row">
            <div class="rating-label">${r.label}</div>
            <div class="rating-bar-track">
                <div class="rating-bar-fill" data-value="${r.value}"></div>
            </div>
            <div class="rating-value">${r.value}%</div>
        </div>`).join('');

    // Screenshots
    document.getElementById('modalScreenshots').innerHTML = p.screenshots.map(s => `
        <div class="screenshot-item">
            <img src="${s}" alt="Screenshot" loading="lazy">
        </div>`).join('');

    // Fields
    document.getElementById('modalFields').innerHTML = p.fields.map(f => `
        <span class="field-tag ${f.color}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>
            ${f.label}
        </span>`).join('');

    // Open modal
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    modal.scrollTop = 0;

    // Animate rating bars after short delay
    setTimeout(() => {
        document.querySelectorAll('.rating-bar-fill').forEach(bar => {
            bar.style.width = bar.dataset.value + '%';
        });
    }, 200);
}

function closeModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    // Reset bars
    document.querySelectorAll('.rating-bar-fill').forEach(b => b.style.width = '0%');
}

document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Init
renderCards(projects);
</script>
